<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitHub Jarvis</title>
    <script>
      // GitHub Pages serves this file for any unknown path. Encode the path
      // into a query string and hand it back to index.html, which restores it.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
